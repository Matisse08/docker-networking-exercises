name: CI/CD

on:
  push:
    branches:
      - main

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/docker-networking-exercises

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          pip install pytest
          pytest

  e2e-tests:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & run app in background
        run: |
          docker build -t e2e-app-image .
          docker run -d --name e2e-app -p 8080:8080 e2e-app-image
          sleep 10

      - name: Set up Python (E2E)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install E2E dependencies
        working-directory: e2e
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run E2E tests
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8080
        run: |
          pytest

      - name: Cleanup container
        if: always()
        run: |
          docker logs e2e-app || true
          docker rm -f e2e-app || true

  build-and-push:
    name: Build & Push Docker Hub
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

  deploy-azure-vm:
    name: Deploy on Azure VM (SSH)
    runs-on: ubuntu-latest
    needs: [build-and-push]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts || true

      - name: Deploy on VM
        env:
          VM_USER: ${{ secrets.VM_USER }}
          VM_HOST: ${{ secrets.VM_HOST }}
          DOCKER_IMAGE: ${{ env.DOCKER_IMAGE }}
        run: |
          ssh -o StrictHostKeyChecking=no "${VM_USER}@${VM_HOST}" <<'SCRIPT'
            set -e

            IMAGE="${DOCKER_IMAGE}"

            # Pull latest image
            docker pull "$IMAGE" || {
              echo "docker pull failed, trying to login first"
              echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin
              docker pull "$IMAGE"
            }

            # Stop & remove old container if exists (idempotent)
            docker stop myapp || true
            docker rm myapp || true

            # Run new container (fixed name, fixed port)
            docker run -d \
              --name myapp \
              --restart unless-stopped \
              -p 8080:8080 \
              -e APP_VERSION="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA_SHORT}" \
              "$IMAGE"

            # Wait a bit and check health
            sleep 5

            HEALTH_STATUS=$(curl -sf http://localhost:8080/health >/dev/null && echo "ok" || echo "fail")
            if [ "$HEALTH_STATUS" != "ok" ]; then
              echo "Healthcheck failed"
              docker logs myapp || true
              exit 1
            fi

            echo "Deployment successful"
          SCRIPT
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GITHUB_SHA_SHORT: ${{ github.sha }}
