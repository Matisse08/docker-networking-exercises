name: CI/CD

on:
  push:
    branches:
      - main

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/docker-networking-exercises

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        working-directory: app
        run: pytest

  e2e-tests:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t e2e-app-image .

      - name: Start application
        run: |
          docker run -d \
            --name e2e-app \
            -p 8080:8080 \
            e2e-app-image
          sleep 5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install E2E dependencies
        working-directory: e2e
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run E2E tests
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8080
        run: pytest

      - name: Show logs
        if: always()
        run: docker logs e2e-app

      - name: Remove test container
        if: always()
        run: docker rm -f e2e-app || true

  build-and-push:
    name: Build and Push Docker Hub
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - e2e-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy on Azure VM
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          script: |
            set -e

            mkdir -p ~/mm/docker-networking-exercises
            cd ~/mm/docker-networking-exercises

            docker pull "${{ env.DOCKER_IMAGE }}:latest"

            docker rm -f matisse-docker-networking 2>/dev/null || true

            docker run -d \
              --name matisse-docker-networking \
              --restart unless-stopped \
              -p 8081:8080 \
              "${{ env.DOCKER_IMAGE }}:latest"

            sleep 5

            curl --fail http://localhost:8081/health
